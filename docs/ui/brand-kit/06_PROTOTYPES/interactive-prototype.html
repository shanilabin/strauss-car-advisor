*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.topbar{height:var(--top);background:var(--navy);color:white;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 29px;gap:16px;border-bottom:3px solid var(--lime)}.brand{font-weight:900;letter-spacing:.5px;font-size:20px;white-space:nowrap}.brand span{color:var(--lime)}.topmid{font-size:12px;border:1px solid #50608b;padding:7px 12px}.topactions{display:flex;align-items:center;gap:7px}.topbutton{background:transparent;border:1px solid #62739a;color:#fff;padding:8px 11px;font-weight:600}.topbutton:hover{background:#2d3c67}.shell{min-height:calc(100vh - var(--top))}.label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--cobalt)}.subtitle{color:var(--muted);font-size:13px}.headline{font-family:'Secular One',var(--font);font-weight:400}.primary{border:1px solid var(--cobalt);background:var(--cobalt);color:#fff;padding:12px 18px;font-weight:700}.primary:hover{background:#1434b4}.outline{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 16px;font-weight:650}.outline:hover{border-color:var(--cobalt)}.linkbtn{border:0;background:none;color:var(--cobalt);padding:5px 0;font-size:13px;font-weight:750}.intro{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1250px;margin:0 auto;align-items:center;padding:70px 38px}.intro h1{font-size:clamp(44px,5.5vw,82px);line-height:1.07;margin:18px 0;color:var(--text)}.intro p{font-size:19px;max-width:480px;line-height:1.7}.intro-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.intro-demo{border:1px solid var(--border);ba ace{border-right:3px solid var(--cobalt);background:var(--surface2);padding:10px;font-size:11px;line-height:1.9}.profilepreview{padding:20px}.profilepreview h3{margin:0 0 20px}.profile-row{border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;padding:10px 0;font-size:13px}.profile-row span{color:var(--muted)}.profile-row strong{font-weight:700}.missing{color:var(--warn)!important}.profilehint{font-size:12px;color:var(--muted);margin-top:22px}.opts-view{padding:26px;min-height:calc(100vh - var(--top));}.opts-view h1{font-size:35px;margin:0 0 7px}.opts-intro{margin-bottom:24px}.featured{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.vehicle-large{background:var(--surface);border:1px solid var(--border);padding:22px;text-align:right;color:var(--text);min-height:195px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}.vehicle-large:hover{border-color:var(--cobalt)}.vehicle-large .amount{font-size:38px;font-weight:900;color:var(--positive)}.vehicle-large .caption{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;font-size:11px;font-weight:750;background:var(--positive-bg);color:var(--positive)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.neg{background:var(--negative-bg);color:var(--negative)}.otherbox{margin-top:20px;background:var(--surface);border:1px solid var(--border);padding:20px}.otherrow{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--border);padding:12px 5px;background:none;color:var(--text);text-align:right}.otherrow:hover{background:var(--surface2)}.comparelayout{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:14px;padding:18px;align-items:start}.comparelayout.expanded-vehicles{grid-template-columns:280px minmax(0,1fr) 280px}.comparelayout.expanded-chat{grid-template-columns:200px minmax(0,1fr) minmax(420px,35vw)}.sidelist{height:calc(100vh - 100px);position:sticky;top:82px;display:flex;flex-direction:column}.list-body{overflow:auto;padding:10px;flex:1}.listitem{width:100%;text-align:right;padding:10px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;color:var(--text)}.listitem:hover{border-color:var(--cobalt)}.listitem.selected{background:var(--surface2);border-right:4px solid var(--cobalt)}.listitem .first{font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px}.listitem .second{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.listitem .sum{font-size:17px;color:var(--positive);font-weight:900}.listitem .extra{font-size:11px;color:var(--muted);margin-top:7px}.listitem.ineligible{opacity:.65}.results{min-width:0;display:flex;flex-direction:column;gap:16px}.results-title{display:flex;justify-content:space-between;align-items:center;gap:15px}.results-title h2{font-family:'Secular One';font-weight:400;font-size:30px;margin:0}.results-title .subtitle{margin-top:5px}.money-card{background:var(--lime);color:#142352;padding:32px;text-align:center}.money-card .mainnum{font-size:clamp(46px,5.4vw,70px);font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}.money-card .secondary-num{font-weight:800;font-size:23px;font-variant-numeric:tabular-nums}.money-card .netline{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #92b133;padding-top:19px;margin-top:24px;text-align:center}.money-card .netline small{display:block;font-size:11px;margin-bottom:5px}.money-card.negative{background:var(--negative-bg);color:var(--text)}.explanation{background:var(--surface);border:1px solid var(--border);padding:18px;line-height:1.65;font-size:14px}.waterbox{border:1px solid var(--border);background:var(--surface);padding:18px}.waterbar{display:flex;gap:7px;align-items:end;height:110px;margin-top:19px;direction:ltr}.waterbar>div{flex:1;position:relative;min-width:0;background:var(--cobalt)}.waterbar>div.mid{background:#7192e4}.waterbar>div.final{background:var(--navy)}.waterlabels{display:flex;justify-content:space-around;font-size:11px;color:var(--muted);margin-top:7px;direction:rtl}.detailtable{width:100%;border-collapse:collapse;font-size:13px}.detailtable td,.detailtable th{border-bottom:1px solid var(--border);padding:12px 6px;text-align:right}.detailtable th{font-size:11px;color:var(--muted)}.section-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:var(--text);font-weight:800;padding:0 0 12px;text-align:right}.bottomnote{font-size:11px;color:var(--muted)}.waitbanner{border:1px solid #eac46c;background:var(--warn-bg);color:var(--warn);padding:15px 17px;font-size:13px}.waitbanner b{display:block;margin-bottom:4px}.comparechat{height:calc(100vh - 100px);position:sticky;top:82px;min-height:0}.comparechat .chatbody{padding:13px}.comparechat .msg{font-size:12px}.comparechat .chatinput{padding:8px}.comparechat .chatinput input{padding:9px}.profiledrawer{position:fixed;inset:var(--top) 0 0 auto;width:min(400px,100vw);z-index:31;background:var(--surface);border-left:1px solid var(--border);overflow:auto;padding:22px}.overlay{position:fixed;inset:var(--top) 0 0 0;background:rgba(8,14,30,.48);z-index:30}.profiledrawer h2{margin:0 0 22px}.field{margin:15px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;background:var(--surface);color:var(--text);border:0;border-bottom:1px solid var(--border);padding:7px 0}.field .readonly{padding:10px 0;border-bottom:1px solid var(--border);font-weight:700}.formview{padding:35px;max-width:820px;margin:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rep-layout{display:grid;grid-template-columns:minmax(260px,40%) 1fr;gap:15px;padding:22px;max-width:1350px;margin:auto}.rep-questions,.rep-detail{padding:20px;min-height:480px}.rep-question{display:block;width:100%;text-align:right;padding:15px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text)}.rep-question.active{background:var(--surface2);border-right:4px solid var(--cobalt)}.rep-detail input{width:100%;margin-top:6px;padding:9px;border:0;border-bottom:1px solid var(--border);background:var(--surface);color:var(--text)}.rep-detail label{display:block;margin:20px 0 5px;font-size:12px;color:var(--muted)}.mobilebar{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

@media(max-width:640px){:root{--top:56px}.intro{padding:30px 19px}.intro h1{font-size:44px}.intro p{font-size:16px}.featured{grid-template-columns:1fr}.opts-view{padding:20px}.money-card{padding:20px}.money-card .mainnum{font-size:44px}.money-card .secondary-num{font-size:20px}.results-title h2{font-size:24px}.rep-layout{grid-template-columns:1fr;padding:10px}.rep-questions,.rep-detail{min-height:0}.topbutton{padding:7px 8px;font-size:12px}.collect{padding:8px}.chatpanel{height:calc(100dvh - 64px);top:var(--top);min-height:0}.formgrid{grid-template-columns:1fr}.formview{padding:22px}.money-card .netline{gap:4px}}

<body>
<header class="topbar"><div class="brand">STRAUSS <span>/</span> DRIVE</div><div class="topmid" id="phase-indicator">תצוגת אב־טיפוס</div><div class="topactions"><button class="topbutton" id="homebtn" title="דף פתיחה">בית</button><button class="topbutton" id="repbtn" title="מסך נציג">נציג</button><button class="topbutton" id="profilebtn" title="פרופיל">פרופיל</button><button class="topbutton" id="themebtn" title="שינוי ערכת נושא">◐ מצב תצוגה</button></div></header>
<main id="app" class="shell"></main><div id="overlay" class="overlay hidden"></div><aside id="drawer" class="profiledrawer hidden" aria-label="פרופיל עובד"></aside><nav id="mobilebar" class="mobilebar hidden"></nav>
<script>
const data=[
 {id:'waiver',name:'ויתור על הרכב',drive:'ללא רכב',delta:3199,net:14231,eligible:true,reason:'אחזקת רכב 2,000 ₪',icon:'▣'},
 {id:'byd',name:'BYD ATTO 3',drive:'חשמלי',delta:661,net:11693,eligible:true,reason:'שווי שימוש מופחת והחזר חשמל',icon:'ϟ'},
 {id:'current',name:'Toyota Corolla Cross',drive:'היברידי',delta:0,net:11032,eligible:true,reason:'הרכב הנוכחי',icon:'◇'},
 {id:'tesla',name:'Tesla Model 3',drive:'חשמלי',delta:null,net:null,eligible:false,reason:'קבוצה ד׳ — מעל קבוצת הזכאות',icon:'ϟ'}
];
const baseNet=11032;let view='home',chosen='byd',wideList=false,wideChat=false,graphOpen=false,breakdownOpen=false,waiting=false,repAnswered=false,chatExpanded=false,showExamples=false,mobilePane='compare';let messages=[{who:'bot',text:'שלום. אני יכול לעזור להשוות בין אפשרויות הרכב שלך ולהבין את ההשפעה שלהן על הנטו.',quick:['אני שוקלת לעבור לחשמלי','מה אם אוותר על הרכב?','אני רוצה להחליף רכב']},{who:'user',text:'אני רוצה לבדוק מעבר לרכב חשמלי.'},{who:'bot',text:'מצאתי חלופות מתאימות. בחרי רכב כדי להציג השוואה.',trace:true}];
const fmt=n=>n==null?'—':new Intl.NumberFormat('he-IL').format(n)+' ₪';const sign=n=>n==null?'—':(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));const el=id=>document.getElementById(id);const option=()=>data.find(x=>x.id===chosen);const stateText={home:'דף פתיחה',collect:'איסוף נתונים',options:'הצגת אפשרויות',compare:'השוואת חלופות',rep:'מסך נציג',form:'מצב טופס'};
function setView(v){view=v;mobilePane=v==='collect'?'chat':v==='options'?'options':'compare';render();window.scrollTo(0,0)}
function render(){el('phase-indicator').textContent=stateText[view]+(waiting?' · ממתין לנציג':'');el('profilebtn').style.display=view==='rep'?'none':'';el('mobilebar').classList.toggle('hidden',!['compare','options'].includes(view));el('app').innerHTML=({home:homePage,collect:collectPage,options:optionsPage,compare:comparePage,rep:repPage,form:formPage}[view]||homePage)();mobileNav();bind();}
function homePage(){return `<section class="intro"><div><div class="label">STRAUSS DRIVE / CAR ADVISOR</div><h1 class="headline">ההחלטה על הרכב.<br>ברורה במספרים.</h1><p>כמה ישתנה לך הנטו אם תעברי לחשמלי, תחליפי רכב או תוותרי על הרכב?</p><div class="intro-buttons"><button class="primary" data-view="collect">בואו נתחיל ←</button><button class="outline" id="sample">נסו עם עובד לדוגמה</button></div><div class="sample-picker ${showExamples?'':'hidden'}"><b>בחרו עובד לדוגמה</b><p class="subtitle">הדמיה עם נועה לוי — מנהלת מוצר, קבוצה ג׳</p><button class="primary" id="loadsample">נועה לוי — התחילו הדגמה</button></div><p class="fineprint">החישוב מבוסס על נתוני הדגמה ממפרט הפרויקט. אין חיבור למערכת שכר או לשרת.</p></div><div class="intro-demo"><div class="label">LIVE COMPARISON / SAMPLE DATA</div><div class="demo-mini"><div style="font-size:12px">השינוי בנטו החודשי</div><div class="num">+661 ₪</div><div>יותר בנטו במעבר ל־BYD ATTO 3</div></div><div class="mini-line"><span>נטו היום</span><strong>11,032 ₪</strong></div><div class="mini-line"><span>נטו בחלופה</span><strong>11,693 ₪</strong></div><div class="mini-line"><span>רכב חלופי</span><strong>BYD ATTO 3</strong></div><div class="accent-strip" style="background:var(--lime)"></div></div></section>`}
function chatMarkup(){return `<section class="panel chatpanel ${view==='compare'?'comparechat':''}" id="chatpanel"><div class="panelhead"><strong>השיחה עם היועץ</strong><button class="linkbtn" id="expandchat">${wideChat?'צמצום':'הרחבה'} ↗</button></div><div class="chatbody" id="chatbody">${messages.map((m,i)=>`<div class="msg ${m.who==='user'?'user':''}"><div class="who">${m.who==='user'?'את/ה':'יועץ הרכב'}</div><div>${escapeHTML(m.text)}</div>${m.quick?`<div class="quick">${m.quick.map(q=>`<button class="quickreply" data-text="${escapeAttr(q)}">${q}</button>`).join('')}</div>`:''}${m.trace?`<button class="agent-toggle" data-trace="${i}">▤ ${chatExpanded?'הסתר פעולות AI':'הצג פעולות AI'}</button>${chatExpanded?'<div class="trace">01 · tool_call — list_options<br>02 · tool_result — הוחזרו חלופות<br>03 · guard — בדיקת מספרים הושלמה</div>':''}`:''}</div>`).join('')}</div><form class="chatinput" id="chat-form"><input id="chat-text" placeholder="כתיבת הודעה..." autocomplete="off" aria-label="כתיבת הודעה"><button class="primary" type="submit">שלח</button></form></section>`}
function collectPage(){return `<div class="workspace collect">${chatMarkup()}<section class="panel profilepreview"><div class="label">EMPLOYEE PROFILE</div><h3>הנתונים שלך</h3>${profileRows()}<p class="profilehint">הנתונים מוצגים לצורך הדמיה. קבוצת הזכאות נגזרת מהעיסוק; אימות העיסוק טרם הוכרע.</p><button class="primary" data-view="options" style="margin-top:20px;width:100%">הצגת אפשרויות לדוגמה ←</button></section></div>`}
function profileRows(){return [['עיסוק','מנהלת מוצר'],['קבוצת רכב','ג׳ (לא מאומתת)'],['שכר בסיס','18,500 ₪'],['רכב נוכחי','Corolla Cross'],['פנסיה','חסר'],['נקודות זיכוי','חסר']].map(([a,b])=>`<div class="profile-row"><span>${a}</span><strong class="${b==='חסר'?'missing':''}">${b}</strong></div>`).join('')}
function optionsPage(){return `<section class="workspace opts-view"><div class="label">VEHICLE OPTIONS / 01</div><h1 class="headline">האפשרויות שלך.</h1><p class="subtitle opts-intro">החלופות מסודרות לפי השינוי החודשי בנטו. הנתונים להמחשה בלבד.</p><div class="featured">${data.filter(x=>x.eligible).map((x,i)=>`<button class="vehicle-large" data-select="${x.id}"><span class="pill">${i===0?'הכי משתלם':'זכאי'}</span><strong style="font-size:19px">${x.name}</strong><span class="caption">${x.drive}</span><span class="amount">${sign(x.delta)}</span><span class="caption">בחודש · ${x.reason}</span></button>`).join('')}</div><div class="otherbox"><b>אפשרויות נוספות / ללא זכאות</b>${data.filter(x=>!x.eligible).map(x=>`<div class="otherrow"><span>${x.name}<br><small class="subtitle">${x.reason}</small></span><span class="pill neg">לא זכאי</span></div>`).join('')}</div></section>`}
function vehicleList(){return `<aside class="panel sidelist"><div class="panelhead"><strong>רכבים</strong><button class="linkbtn" id="expandlist">${wideList?'צמצום':'הרחבה'} ⇄</button></div><div class="list-body">${data.map(x=>`<button class="listitem ${chosen===x.id?'selected':''} ${!x.eligible?'ineligible':''}" data-select="${x.id}"><div class="first"><span>${x.name}</span><span>${x.icon}</span></div><div class="second"><strong class="sum" style="${!x.eligible?'color:var(--muted)':''}">${x.eligible?sign(x.delta):'—'}</strong><span class="pill ${x.eligible?'':'neg'}">${x.eligible?'זכאי':'לא זכאי'}</span></div>${wideList?`<div class="extra">${x.drive} · ${x.reason}</div>`:''}</button>`).join('')}</div></aside>`}
function comparePage(){const x=option(),valid=x.eligible;const pending=waiting&&chosen==='byd'&&!repAnswered;return `<div class="workspace comparelayout ${wideList?'expanded-vehicles':''} ${wideChat?'expanded-chat':''}">${vehicleList()}<article class="results"><div class="results-title"><div><div class="label">MONTHLY NET / COMPARISON</div><h2>ההשוואה שלך</h2><div class="subtitle">${x.name} מול הרכב הנוכחי</div></div><span class="pill ${valid?'':'neg'}">${valid?'זכאי':'לא זכאי'}</span></div>${pending?'<div class="waitbanner"><b>ממתינים לאישור נציג התחבורה</b>גובה ההשתתפות ב־BYD ATTO 3 טרם אושר. הסכומים הזמניים מחייבים בדיקת הנתונים; אפשר להשוות חלופות אחרות בינתיים.</div>':''}${!valid?`<div class="waitbanner"><b>אין זכאות לחלופה הזו</b>${x.reason}. לא מוצגת תוצאה מספרית לחלופה שאינה מותרת.</div>`:`<section class="money-card ${x.delta<0?'negative':''}" id="money"><div style="font-weight:700;font-size:14px">${pending?'הפרש נטו חודשי משוער':'ההפרש בנטו החודשי'}</div><div class="mainnum">${sign(x.delta)}</div><div style="font-weight:750">${x.delta>0?'יותר בנטו בכל חודש':x.delta===0?'ללא שינוי בנטו':'פחות בנטו בכל חודש'}</div><div class="netline"><div><small>נטו היום</small><div class="secondary-num">${fmt(baseNet)}</div></div><div><small>נטו בחלופה${pending?' · משוער':''}</small><div class="secondary-num">${fmt(x.net)}</div></div></div></section><div class="explanation">${x.id==='byd'?'שינוי בשווי השימוש והחזר החשמל מגדילים את הנטו החודשי.':x.id==='waiver'?'ויתור על רכב החברה והחזר האחזקה משנים את שכר הנטו.':'בהשוואה לרכב הנוכחי, לא חל שינוי בנטו.'}${pending?'<div style="margin-top:10px"><span class="pill warn">ממתין לאישור נציג</span></div>':''}</div><section class="waterbox"><button class="section-toggle" id="togglegraph"><span>איך חושב ההפרש? <small class="subtitle">/ גרף מפל</small></span><span>${graphOpen?'−':'+'}</span></button><div class="waterbar"><div style="height:62%"></div><div class="mid" style="height:77%"></div><div class="mid" style="height:87%"></div><div class="final" style="height:91%"></div></div><div class="waterlabels"><span>היום</span><span>שווי שימוש</span><span>החזר/אחזקה</span><span>חלופה</span></div><div class="${graphOpen?'':'hidden'}" style="margin-top:18px;font-size:12px;color:var(--muted)">פירוט הגורמים בהתאם לתוצאת החישוב. התרשים כאן סכמטי בלבד; גבהי העמודות אינם נתון פיננסי מחושב.</div></section><section class="waterbox"><button id="toggledetail" class="section-toggle"><span>פירוט מלא של החישוב</span><span>${breakdownOpen?'−':'+'}</span></button><div class="${breakdownOpen?'':'hidden'}"><table class="detailtable"><tr><th>רכיב</th><th>היום</th><th>בחלופה</th></tr><tr><td>נטו</td><td>${fmt(baseNet)}</td><td>${fmt(x.net)}</td></tr><tr><td>הפרש נטו</td><td>—</td><td>${sign(x.delta)}</td></tr><tr><td>נתוני מס והפרשות</td><td colspan="2">יוצגו ממנוע החישוב בלבד</td></tr></table></div></section>`}<div class="bottomnote">נתוני עובדים לדוגמה בלבד · מס 2025 · שווי שימוש 2026 · אין חיבור ל־API</div>${x.id==='byd'?`<button class="outline" id="waittoggle">${pending?'הדגמת קבלת תשובת נציג':repAnswered?'איפוס הדגמת נציג':'הדגמת המתנה לנציג'}</button>`:''}</article>${chatMarkup()}</div>`}
function repPage(){return `<section class="rep-layout"><div class="panel rep-questions"><div class="label">TRANSPORT SUPPORT</div><h2>שאלות פתוחות</h2><button class="rep-question active"><b>השתתפות — BYD ATTO 3</b><div class="subtitle">מנהלת מוצר · קבוצה ג׳</div><span class="pill warn">ממתין למענה</span></button><button class="rep-question"><b>שאלות שנענו</b><div class="subtitle">היסטוריה — הדמיה</div></button></div><div class="panel rep-detail"><div class="label">QUESTION DETAILS</div><h2>טיפול בשאלה</h2><p><b>מה גובה ההשתתפות החודשית ב־BYD ATTO 3?</b></p><div class="profile-row"><span>עיסוק</span><strong>מנהלת מוצר</strong></div><div class="profile-row"><span>קבוצה</span><strong>ג׳</strong></div><div class="profile-row"><span>רכב נוכחי</span><strong>Toyota Corolla Cross</strong></div><div class="profile-row"><span>רכב מבוקש</span><strong>BYD ATTO 3</strong></div><label for="repvalue">השתתפות חודשית (₪)</label><input type="number" min="0" id="repvalue" value="350"><label for="repdate">בתוקף מתאריך (אופציונלי)</label><input type="date" id="repdate"><button class="primary" id="repanswer" style="margin-top:22px">שליחת תשובה לדוגמה</button><p class="fineprint">כפתור ההדגמה משנה מצב בדפדפן המקומי בלבד; אינו שולח נתונים לשרת.</p></div></section>`}
function formPage(){return `<section class="formview panel"><div class="label">FALLBACK FORM</div><h1 class="headline">פרטי העובד</h1><p class="subtitle">אותו מנוע חישובים, ללא שיחה עם AI. הדמיית טופס בלבד.</p><div class="formgrid">${[['עיסוק','מנהלת מוצר'],['שכר בסיס','18500'],['אחוז פנסיה','6'],['נקודות זיכוי','2.25']].map(([l,v])=>`<div class="field"><label>${l}</label><input value="${v}"></div>`).join('')}</div><button class="primary" data-view="options">הצגת אפשרויות לדוגמה</button></section>`}
function profileDrawer(){el('overlay').classList.remove('hidden');el('drawer').classList.remove('hidden');el('drawer').innerHTML=`<button class="linkbtn" id="closedrawer">✕ סגירה</button><h2 class="headline">הפרופיל שלי</h2><div class="label">נתונים תעסוקתיים</div><div class="field"><label>עיסוק</label><div class="readonly">מנהלת מוצר</div></div><div class="field"><label>קבוצת זכאות</label><div class="readonly">ג׳ · נגזרת מהעיסוק</div><div class="subtitle">אימות העיסוק וההרשאות עדיין פתוחים להחלטת הצוות.</div></div><div class="label" style="margin-top:25px">שכר והפרשות</div>${[['שכר בסיס','18500'],['פנסיה (%)','6'],['קרן השתלמות (%)','2.5'],['נקודות זיכוי','2.25']].map(([l,v])=>`<div class="field"><label>${l}</label><input value="${v}" aria-label="${l}"></div>`).join('')}<div class="label" style="margin-top:25px">הרכב הנוכחי</div><div class="field"><label>רכב</label><div class="readonly">Toyota Corolla Cross</div></div><button class="primary" id="saveprofile">שמירת שינויים (הדמיה)</button>`;el('closedrawer').onclick=closeDrawer;el('saveprofile').onclick=()=>{closeDrawer();messages.push({who:'bot',text:'פרטי הפרופיל עודכנו בתצוגת ההדגמה. במערכת האמיתית ההשוואה תחושב מחדש בשרת.'});render()};}
function closeDrawer(){el('overlay').classList.add('hidden');el('drawer').classList.add('hidden')}
function mobileNav(){const bar=el('mobilebar');if(!['compare','options'].includes(view))return;bar.innerHTML=`<button data-mobile="options" class="${mobilePane==='options'?'active':''}">רכבים</button><button data-mobile="compare" class="${mobilePane==='compare'?'active':''}">השוואה</button><button data-mobile="chat" class="${mobilePane==='chat'?'active':''}">צ'אט</button>`;bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{mobilePane=b.dataset.mobile;if(mobilePane==='options')setView('options');else if(mobilePane==='compare')setView('compare');else{if(view!=='compare')setView('compare');el('chatpanel').classList.add('compare-chat-sheet');bar.querySelectorAll('button').forEach(a=>a.classList.remove('active'));b.classList.add('active')}})}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHTML(s)}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{chosen=b.dataset.select;setView('compare')});el('sample')&&(el('sample').onclick=()=>{showExamples=!showExamples;render()});el('loadsample')&&(el('loadsample').onclick=()=>setView('options'));el('expandlist')&&(el('expandlist').onclick=()=>{wideList=!wideList;render()});el('expandchat')&&(el('expandchat').onclick=()=>{wideChat=!wideChat;render()});el('togglegraph')&&(el('togglegraph').onclick=()=>{graphOpen=!graphOpen;render()});el('toggledetail')&&(el('toggledetail').onclick=()=>{breakdownOpen=!breakdownOpen;render()});el('waittoggle')&&(el('waittoggle').onclick=()=>{if(waiting){repAnswered=true;waiting=false;messages.push({who:'bot',text:'הנציג עדכן את פרטי ההשתתפות. במערכת האמיתית הנטו יחושב מחדש על ידי השרת.'});}else if(repAnswered){repAnswered=false;}else{waiting=true;messages.push({who:'bot',text:'נשלחה שאלה לנציג התחבורה לגבי גובה ההשתתפות ברכב.'})}render()});document.querySelectorAll('[data-trace]').forEach(b=>b.onclick=()=>{chatExpanded=!chatExpanded;render()});document.querySelectorAll('.quickreply').forEach(b=>b.onclick=()=>sendMessage(b.dataset.text));el('chat-form')&&(el('chat-form').onsubmit=e=>{e.preventDefault();const input=el('chat-text');if(input.value.trim())sendMessage(input.value.trim())});el('repanswer')&&(el('repanswer').onclick=()=>{repAnswered=true;waiting=false;messages.push({who:'bot',text:'הנציג עדכן את גובה ההשתתפות. השוואה חדשה תתקבל מהשרת במימוש האמיתי.'});chosen='byd';setView('compare')});}
function sendMessage(text){messages.push({who:'user',text});messages.push({who:'bot',text:'בהדמיה הזו השיחה אינה מחוברת למודל. אפשר לראות את החלופות ואת ההשוואה דרך התצוגות הקיימות.',quick:['הצגת אפשרויות לדוגמה']});render();const b=el('chatbody');if(b)b.scrollTop=b.scrollHeight;document.querySelectorAll('.quickreply').forEach(x=>{if(x.dataset.text==='הצגת אפשרויות לדוגמה')x.onclick=()=>setView('options')})}
el('homebtn').onclick=()=>setView('home');el('repbtn').onclick=()=>setView('rep');el('profilebtn').onclick=profileDrawer;el('overlay').onclick=closeDrawer;let initialTheme=localStorage.getItem('strauss-prototype-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=initialTheme;el('themebtn').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('strauss-prototype-theme',t)};render();
</script>
</body></html>
